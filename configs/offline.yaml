# Offline pipeline validation.
#
# Runs the ENTIRE harness -- every model, every rung of the optimization ladder,
# the benchmark grid, and report generation -- using synthetic tensors instead of
# CIFAR-10. Nothing is downloaded.
#
# Results produced by this config are meaningless as a study of model quality and
# must never be published or compared against the reference results. Its only job
# is to prove that the plumbing works on a machine with no network and no GPU.
#
#   edgebench run-all --config configs/offline.yaml
#
# Expect a few minutes on a laptop CPU.
seed: 0

data:
    name: synthetic
    root: data
    val_size: 0
    num_workers: 0
    augment: false
    download: false

train:
    epochs: 1
    batch_size: 64
    lr: 0.05
    scheduler: none
    warmup_epochs: 0
    label_smoothing: 0.0
    log_interval: 0
    qat_epochs: 1
    qat_lr: 1.0e-3

benchmark:
    device: cpu
    resolutions: [32]
    batch_sizes: [1, 8]
    warmup_iters: 3
    timed_iters: 10
    repeats: 2
    thread_counts: [1]

# The full ladder, including the entries the smoke config disables, so that every
# optimization implementation is exercised by this run.
optimizations:
    - id: fp32
      enabled: true
    - id: compile
      enabled: true
    - id: dynamic_int8
      enabled: true
    - id: static_int8
      enabled: true
    - id: qat_int8
      enabled: true
    - id: prune_unstructured_50
      enabled: true
    - id: onnxruntime
      enabled: true
    - id: onnxruntime_int8
      enabled: true

paths:
    checkpoints: checkpoints/offline
    results: results/offline
    figures: results/offline/figures
    tables: results/offline/tables
    raw: results/offline/raw
