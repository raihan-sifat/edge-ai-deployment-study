name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PYTHONUNBUFFERED: "1"

jobs:
    lint:
        name: Lint and format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip
            - name: Install ruff
              run: pip install "ruff>=0.5"
            - name: ruff check
              run: ruff check .
            - name: ruff format --check
              run: ruff format --check .

    test:
        name: Test (Python ${{ matrix.python-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.11", "3.12"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip
            - name: Install CPU PyTorch
              run: |
                  pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
            - name: Install package
              run: |
                  pip install -e ".[dev]"
            - name: Run unit tests (no network)
              run: pytest -m "not network and not slow" --cov=edgebench --cov-report=term-missing
            - name: Upload coverage
              if: matrix.python-version == '3.11'
              uses: actions/upload-artifact@v4
              with:
                  name: coverage
                  path: .coverage
                  if-no-files-found: ignore

    smoke-pipeline:
        name: End-to-end smoke pipeline
        runs-on: ubuntu-latest
        needs: [test]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip
            - name: Install CPU PyTorch
              run: |
                  pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
            - name: Install package
              run: |
                  pip install -e ".[onnx]"
            - name: Cache CIFAR-10
              uses: actions/cache@v4
              with:
                  path: data
                  key: cifar10-v1
            - name: Run smoke config on a single model
              run: |
                  edgebench run-all \
                    --config configs/smoke.yaml \
                    --models resnet18 \
                    --no-download
            - name: Report generation
              run: edgebench report --results results/smoke
            - name: Export portfolio assets
              run: python scripts/export_portfolio_assets.py --results results/smoke
            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: smoke-results
                  path: |
                      results/smoke/tables
                      results/smoke/figures
                  if-no-files-found: warn

    portfolio-page:
        name: Validate portfolio case study
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
            # Deliberately not tracked dependencies: the MDX validator is an asset
            # check for the portfolio page, not part of the benchmark harness.
            - name: Install MDX validation dependencies
              run: >-
                  npm install --no-save --no-fund --no-audit
                  "@mdx-js/mdx@^3" remark-frontmatter remark-mdx-frontmatter
            - name: Validate case study
              run: node scripts/validate_case_study.mjs
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Build the HTML report
              run: python scripts/build_report.py --html-only
