name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PYTHONUNBUFFERED: "1"

jobs:
    lint:
        name: Lint and format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.11"
                  cache: pip
            - name: Install ruff
              run: pip install "ruff>=0.5"
            - name: ruff check
              run: ruff check .
            - name: ruff format --check
              run: ruff format --check .

    test:
        name: Test (Python ${{ matrix.python-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.11", "3.12"]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip
            - name: Install CPU PyTorch
              run: |
                  pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
            - name: Install package
              run: |
                  pip install -e ".[dev]"
            - name: Run unit tests
              run: pytest -m "not network and not slow" --cov=edgebench --cov-report=term-missing
            - name: Upload coverage
              if: matrix.python-version == '3.11'
              uses: actions/upload-artifact@v7
              with:
                  name: coverage
                  path: .coverage
                  if-no-files-found: ignore

    # ---------------------------------------------------------------------------
    # Validates every code path in the harness using synthetic data, so it needs
    # no network and no dataset download and cannot fail for infrastructure
    # reasons.
    #
    # This job previously used configs/smoke.yaml with --no-download against a cold
    # cache, which failed by construction: a cache can only be populated by a
    # successful run, and the run could not succeed without the cache. Synthetic
    # data removes the circular dependency. Real-data coverage is in `real-data`.
    # ---------------------------------------------------------------------------
    smoke-pipeline:
        name: Pipeline smoke test (synthetic, offline)
        runs-on: ubuntu-latest
        needs: [test]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.11"
                  cache: pip
            - name: Install CPU PyTorch
              run: |
                  pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
            - name: Install package
              run: |
                  pip install -e ".[onnx]"
            - name: Run part of the ladder on synthetic data
              run: |
                  edgebench run-all \
                    --config configs/offline.yaml \
                    --models resnet18 \
                    --optimizations fp32,compile,dynamic_int8,static_int8,prune_unstructured_50,onnxruntime \
                    --no-memory
            - name: Regenerate the report from stored records
              run: edgebench report --results results/offline
            - name: Export portfolio assets
              run: python scripts/export_portfolio_assets.py --results results/offline
            - name: Assert results were actually produced
              run: python scripts/ci_assert_smoke.py

    # ---------------------------------------------------------------------------
    # Exercises the real-data path: downloads CIFAR-10, trains one model for one
    # epoch, and benchmarks it. Slower, but it is the only job that would catch a
    # CIFAR-10 regression, a data-split bug, or a torchvision API change.
    #
    # The cache is what makes this affordable: a cold cache downloads ~170 MB once,
    # and the post-run step persists it for subsequent runs.
    # ---------------------------------------------------------------------------
    real-data:
        name: Real CIFAR-10 data path
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.11"
                  cache: pip
            - name: Install CPU PyTorch
              run: |
                  pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
            - name: Install package
              run: |
                  pip install -e ".[onnx]"
            - name: Cache CIFAR-10
              uses: actions/cache@v6
              with:
                  path: data
                  key: cifar10-torchvision-v1
            - name: Train one epoch on real CIFAR-10 and benchmark the baseline
              run: |
                  edgebench run-all \
                    --config configs/smoke.yaml \
                    --models resnet18 \
                    --optimizations fp32,dynamic_int8 \
                    --no-memory
            - name: Assert the real dataset was used and the run looks healthy
              run: python scripts/ci_assert_real_data.py

    portfolio-page:
        name: Validate portfolio case study
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "22"
            # Deliberately not tracked dependencies: the MDX validator is an asset
            # check for the portfolio page, not part of the benchmark harness.
            - name: Install MDX validation dependencies
              run: >-
                  npm install --no-save --no-fund --no-audit
                  "@mdx-js/mdx@^3" remark-frontmatter remark-mdx-frontmatter
            - name: Validate the case study compiles and consumes its frontmatter
              run: node scripts/validate_case_study.mjs
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.11"
            - name: Build the HTML report
              run: python scripts/build_report.py --html-only
            - name: Assert the HTML report was written
              run: python scripts/ci_assert_report.py
